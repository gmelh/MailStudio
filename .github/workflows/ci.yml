# Checks every push and pull request: server tests and linting, the web app's types and
# build, and the installer script. The release workflow runs the same checks first.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy mailstudio
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the installer
        run: shellcheck install/install.sh scripts/*.sh
      - name: Dry run, as people run it (piped into bash)
        run: |
          bash install/install.sh --dry-run --dir "$RUNNER_TEMP/ms" --domain mail.example.com < /dev/null
          shellcheck "$RUNNER_TEMP/ms/mailstudio"
          docker compose --project-directory "$RUNNER_TEMP/ms" config --quiet
