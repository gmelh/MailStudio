[project]
name = "mailstudio"
version = "0.8.1"
description = "Self-hosted email campaigns without the marketing machinery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "email-validator>=2.1",
  "python-multipart>=0.0.9",
  "chevron>=0.14",
  "mrml>=0.2.4",
  "boto3>=1.35",
  "cryptography>=43",
  "dnspython>=2.6",
  "Pillow>=10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-chevron", "boto3-stubs[sesv2,sns,sts]"]

[project.scripts]
mailstudio = "mailstudio.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mailstudio*"]

[tool.setuptools.package-data]
mailstudio = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Inline-styled HTML for the hosted pages and confirmation email reads better unwrapped.
"mailstudio/signup.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mailstudio"]
